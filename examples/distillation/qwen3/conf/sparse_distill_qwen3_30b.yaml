model:
  tensor_model_parallel_size: 2
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 4
  sequence_parallel: true
  seq_length: 8192

train:
  train_iters: 3000
  micro_batch_size: 1
  global_batch_size: 32
  freeze_student: true
  swa_only: false
  distill_alpha: 1.0
  distill_beta: 1.0
  distill_temperature: 1.0
  use_jsd: true

optimizer:
  lr: 1e-4
  min_lr: 1e-5

scheduler:
  lr_warmup_iters: 500
  lr_decay_style: cosine
  lr_decay_iters: 3000

logger:
  log_interval: 1

validation:
  eval_iters: 2000

checkpoint:
  save: null

dataset:
  dataset_root: "/root/paddlejob/amfp-inference-public/wanghaoshuang/data/megatron_sft_fixed"
  seq_length: 8192
  dataloader_type: "cyclic"
  memmap_workers: 32
  do_validation: false
  do_test: false
  seed: 5678
  dataset_kwargs: {
    "chat": False,
    "use_hf_tokenizer_chat_template": False,
    "add_bos": False,
    "pad_to_max_length": False,
    "answer_only_loss": False,
    "truncation_field": "input"
  }

tokenizer:
  eos_token: "<|im_end|>"
